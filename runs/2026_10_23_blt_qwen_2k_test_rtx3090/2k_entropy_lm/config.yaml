task: entropy_lm
dataset: data/prepared/fw2_2k
cache_dir: null
run_dir: runs/2k_entropy_lm
seed: 42
resume_from: null
entropy_model:
  dim: 768
  n_layers: 14
  n_heads: 12
  sliding_window: 512
train:
  precision: auto
  seq_len: 2048
  batch_size: 8
  grad_accum: 1
  lr: 0.0004
  min_lr_ratio: 0.1
  warmup_steps: 30
  weight_decay: 0.1
  grad_clip: 1.0
  max_steps: 300
  max_hours: 0
  val_fraction: 0.01
  eval_every: 100
  eval_batches: 5
  save_every: 0
  log_every: 20
profile: rtx24gb
