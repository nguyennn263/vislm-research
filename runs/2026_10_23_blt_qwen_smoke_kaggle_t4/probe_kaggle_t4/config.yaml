task: blt_qwen
dataset: /kaggle/working/data/fineweb2_vi
cache_dir: null
run_dir: /kaggle/working/runs/probe_kaggle_t4
seed: 42
resume_from: null
model:
  qwen_name_or_path: Qwen/Qwen3.5-0.8B-Base
  dim_local: 512
  n_layers_encoder: 1
  n_layers_decoder: 9
  n_heads_local: 8
  cross_attn_nheads: 8
  cross_attn_k: 2
  cross_attn_all_layers_encoder: false
  cross_attn_all_layers_decoder: true
  local_attention_window: 512
  hash_ngram_sizes:
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  hash_vocab: 50002
  hash_funcs: 1
patching:
  mode: entropy
  entropy_ckpt: /kaggle/working/runs/entropy_lm_smoke/entropy_lm.pt
  threshold: null
  target_mean_patch_bytes: 4.5
  monotonicity: false
  max_patch_length: null
train:
  precision: auto
  seq_len: 2048
  batch_size: 4
  grad_accum: 1
  lr: 0.0004
  lr_global: 3.0e-05
  freeze_global: true
  grad_checkpointing: true
  min_lr_ratio: 0.1
  warmup_steps: 2
  weight_decay: 0.1
  grad_clip: 1.0
  max_steps: 10
  val_fraction: 0.01
  eval_every: 500
  eval_batches: 4
  save_every: 0
  log_every: 1
  save_final: false
profile: kaggle_t4
