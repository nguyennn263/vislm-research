note: "IMPORTANT finding: the B/A bits-per-byte ratio is WIDENING (1.83x -> 2.13x) as
      training progresses, not narrowing - opposite of the naive 'byte-level catches up
      with more compute' expectation. Both arms are still improving in absolute terms,
      Arm A just improves faster in this window. Could mean: (1) the crossover BLT's
      own paper reports needs much larger scale than reached here, (2) this repo's
      scoped-down BLT (mean-pool encoder, simple decoder) underperforms a full
      implementation, (3) shared LR/warmup isn't tuned for BLT specifically, (4)
      entropy_threshold=3.7 still not well-tuned. Not resolved - see
      phases/phase-2-small-train.md."
