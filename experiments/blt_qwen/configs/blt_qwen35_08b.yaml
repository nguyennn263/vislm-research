# BLT around Qwen3.5-0.8B-Base (vislm/backbones/models/blt_qwen.py): the only BLT testbed
# from 2026-10-18 on. Model shape mirrors BLT-1B ratios (see the module docstring).
#   python -m vislm.train_blt_qwen experiments/blt_qwen/configs/blt_qwen35_08b.yaml profile=kaggle_t4
task: blt_qwen
dataset: data/prepared/fineweb2_vi
cache_dir: null
run_dir: runs/blt_qwen35_08b
seed: 42
resume_from: null
model:
  qwen_name_or_path: Qwen/Qwen3.5-0.8B-Base
  dim_local: 512
  n_layers_encoder: 1
  n_layers_decoder: 9
  n_heads_local: 8
  cross_attn_nheads: 8
  cross_attn_k: 2
  cross_attn_all_layers_encoder: false
  cross_attn_all_layers_decoder: true
  local_attention_window: 512
  hash_ngram_sizes: [3, 4, 5, 6, 7, 8]
  # DEVIATION: BLT-1B uses 500002 (1.54B params at dim 512, ~25GB with fp32 Adam).
  hash_vocab: 100002
  hash_funcs: 1
patching:
  mode: entropy                     # entropy | whitespace (Vietnamese-correct space patching)
  entropy_ckpt: runs/blt_qwen_entropy_lm/entropy_lm.pt
  threshold: null                   # null = calibrate on val bytes to hit the target below
  target_mean_patch_bytes: 4.5      # BLT paper's main setting
  monotonicity: false
  max_patch_length: null
doc_eval:                           # vislm/eval_bpb.py - same docs as the Qwen-BPE baseline
  n_docs: 500
  max_bytes: 4096
train:
  precision: auto
  seq_len: 4096                     # bytes per row
  batch_size: 4
  grad_accum: 4
  lr: 0.0004                        # new local encoder/decoder
  lr_global: 0.00003                # pretrained Qwen body
  freeze_global: false
  grad_checkpointing: true
  min_lr_ratio: 0.1
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  max_steps: 20000
  max_hours: 0                      # >0: stop + save cleanly before a session limit
  val_fraction: 0.01
  eval_every: 500
  eval_batches: 20
  save_every: 500
  log_every: 10

profiles:
  # pipeline check on Kaggle: whitespace patching (no entropy model needed), a few steps
  kaggle_smoke:
    model: {hash_vocab: 50002}
    patching: {mode: whitespace}
    train: {seq_len: 1024, batch_size: 4, grad_accum: 1, warmup_steps: 5, max_steps: 30,
            eval_every: 15, eval_batches: 4, save_every: 15, log_every: 5}
  # Kaggle T4 16GB: stage 1 (Bolmo-style) - Qwen body frozen, only the byte modules learn
  kaggle_t4:
    model: {hash_vocab: 50002}
    train: {freeze_global: true, seq_len: 2048, batch_size: 4, grad_accum: 4, max_hours: 10.5}
  # bs 4 x accum 4 OOMs on a 3090 once Adam state exists (23.6GB at step 1); same 64k bytes/step
  rtx24gb:
    train: {seq_len: 4096, batch_size: 2, grad_accum: 8}
  # CPU plumbing check with a tiny random Qwen3.5 body - run with train.max_steps=0
  # (eval only); never used for real numbers
  cpu_plumbing:
    model: {dim_local: 32, n_layers_decoder: 2, n_heads_local: 4, cross_attn_nheads: 4, hash_vocab: 1009}
    patching: {mode: whitespace}
    debug_qwen_text_config:
      vocab_size: 8
      hidden_size: 64
      intermediate_size: 128
      num_hidden_layers: 4
      layer_types: [linear_attention, linear_attention, linear_attention, full_attention]
      num_attention_heads: 4
      num_key_value_heads: 2
      head_dim: 16
      linear_num_key_heads: 4
      linear_num_value_heads: 4
      linear_key_head_dim: 16
      linear_value_head_dim: 16
      rope_parameters: {rope_type: default, rope_theta: 10000000, partial_rotary_factor: 0.25,
                        mrope_section: [1, 1, 0], mrope_interleaved: true}
    train: {precision: fp32, seq_len: 256, batch_size: 2, grad_accum: 1, max_steps: 0,
            eval_batches: 2, warmup_steps: 0}
