# Câu hỏi con 1.2b — Entropy byte-tiếp-theo, model pretrain riêng tiếng Việt (plans/PLAN.md, Trụ cột 1)
phase: phase-1-no-train
status: chưa chạy
model: NlpHUST/gpt2-vietnamese  # PhoGPT-4B lỗi tương thích transformers mới, xem vislm/tokenizers/bpe_baseline.py
compute: kaggle  # cần forward pass, ưu tiên free GPU thay vì tốn giờ máy RTX 24GB
input_corpus: data/prepared/pillar1/syllable_boundary_sample_vi.txt  # PHẢI GIỐNG HỆT 1_2a để so sánh được
metric: entropy_peak_vs_syllable_boundary_overlap
compare_against: 1_2a_entropy_multilingual_model
threshold_pass: "> 70% trùng khớp, VÀ gần với kết quả 1_2a"
output: runs/pillar1_1_2b/metrics.jsonl
