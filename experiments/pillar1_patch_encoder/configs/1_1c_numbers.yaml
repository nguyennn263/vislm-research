# Câu hỏi con 1.1c — Số liệu (plans/PLAN.md, Trụ cột 1)
phase: phase-1-no-train
status: chưa chạy
tokenizer: NlpHUST/gpt2-vietnamese  # PhoGPT-4B lỗi tương thích transformers mới, xem vislm/tokenizers/bpe_baseline.py
input_wordlist: data/prepared/pillar1/numbers_vi.txt  # cần tạo: ngày tháng, tiền tệ, mã số
