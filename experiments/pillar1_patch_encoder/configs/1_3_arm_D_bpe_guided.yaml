# Câu hỏi con 1.3, Arm D — byte-level nhưng ranh giới patch lấy từ BPE tokenizer thật
# (không dùng entropy model tự học) — ý tưởng "mượn cắt cụm, không mượn từ vựng" từ
# paper Super Tiny Language Models (arXiv:2405.14159), xem phases/phase-2-small-train.md
# mục "Hướng cải thiện sau khi có kết luận 1.3".
phase: phase-2-small-train
status: chưa chạy
compute: rtx24gb_ssh  # override: compute=kaggle_debug dataset_target_gb=0.05 (see vislm/args.py)
arm: D
tokenizer: vislm.tokenizers.blt_patch_encoder  # vẫn byte-level, vocab=256 — chỉ MƯỢN ranh giới patch từ BPE
architecture: blt_bpe_guided
dataset: data/prepared/fineweb2_vi  # HuggingFaceFW/fineweb-2, config vie_Latn, xem setup/download_prepare_data.py
dataset_target_gb: 0.05  # debug scale; override lên GB thật khi chạy full
model:
  # d_model=224 (không phải 192 như Arm B/C) — Arm D không tốn compute entropy model,
  # và patch trung bình dài hơn hẳn (~5.4 byte, gần bằng byte/token thật của Arm A ~5.06
  # — hợp lý vì dùng chung tokenizer PhoGPT để tìm ranh giới). Đo bằng
  # measure_compute_match.py: 192 cho ratio 0.71x Arm A (quá nhẹ), 224 cho 0.97x —
  # trong ngưỡng ±20%. Vì vậy D "rẻ" hơn B/C ở cùng d_model, được phép to hơn 1 chút.
  d_model: 224
  n_layers: 6
  n_heads: 8
  max_seq_len: 512
patching:
  max_patch_len: 16
  bpe_tokenizer_name: vinai/PhoGPT-4B  # dùng CHÍNH tokenizer của Arm A để tìm ranh giới — không dùng vocab/embedding của nó
encoder_type: mean_pool  # đổi thành cross_attention để test riêng ý tưởng cải thiện #2 (xem 1_3_arm_B2)
# KHÔNG CẦN entropy_model — Arm D không có entropy model, không tốn compute pretrain nó
# (num_latent_params == num_params, đã verify local: không có overhead thừa).
train:
  lr: 0.0003
  min_lr: 0.00003
  warmup_steps: 50
  grad_clip: 1.0
  batch_size: 8
  max_steps: 200
  val_fraction: 0.05
  eval_every: 50
  eval_steps: 20
  save_every: 100
  # KHÔNG có entropy_pretrain_steps — Arm D bỏ qua bước này hoàn toàn (train.py tự skip
  # khi model.entropy_model is None), tiết kiệm compute so với Arm B/C.
seed: 42
compare_against: [1_3_arm_A_bpe, 1_3_arm_B_blt]  # D vs A: BPE-cắt-cụm + byte-vocab có tốt hơn cả 2 không? D vs B: cắt theo BPE thật có hơn tự đoán bằng entropy không?
resume_from: null
run_dir: runs/pillar1_1_3_arm_D_debug
