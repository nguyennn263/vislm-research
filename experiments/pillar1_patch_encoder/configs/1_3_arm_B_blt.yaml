# Câu hỏi con 1.3, Arm B — BLT thuần entropy (plans/PLAN.md, Trụ cột 1)
phase: phase-2-small-train
status: chưa chạy
compute: rtx24gb_ssh  # override: compute=kaggle_debug dataset_target_gb=0.05 (see vislm/args.py)
arm: B
tokenizer: vislm.tokenizers.blt_patch_encoder  # byte-level, không cần tokenizer_name
architecture: blt_entropy_patching  # đúng ý tưởng gốc facebookresearch/blt, không mồi âm tiết
# Biến số cố định giữa Arm A/B/C — PHẢI giống hệt 1_3_arm_A_bpe.yaml:
dataset: data/prepared/fineweb2_vi  # HuggingFaceFW/fineweb-2, config vie_Latn, xem setup/download_prepare_data.py
dataset_target_gb: 0.05  # debug scale; override lên GB thật khi chạy full trên RTX 24GB
model:
  d_model: 256      # latent transformer — giữ giống Arm A để so compute
  n_layers: 6
  n_heads: 8
  max_seq_len: 512  # tính theo BYTE, không phải patch
entropy_model:
  d_model: 128      # model entropy nhỏ hơn nhiều so với latent transformer, theo đúng thiết kế BLT
  n_layers: 4
  n_heads: 4
patching:
  entropy_threshold: 1.5  # TODO: chưa tune, cần quét theo phân phối entropy thật trên data
  max_patch_len: 16
# LƯU Ý: đo thật trên Kaggle (runs/2026_09_13_train_arm_b_debug_kaggle_gpu/) cho thấy
# latent_params Arm B (~6.5M) THẤP hơn tổng params Arm A (~10.1M) dù cùng d_model/n_layers/
# n_heads — vì Arm A có bảng embedding từ vựng lớn (vocab_size PhoGPT = 20480, chiếm phần
# lớn tham số), còn Arm B chỉ cần bảng byte (256). Đây là khác biệt CẤU TRÚC giữa BPE và
# byte-level, không phải lỗi config — nên so theo FLOPs (đúng nguyên tắc cô lập biến số
# trong plans/PLAN.md), không chỉ đếm tham số thô. Chưa đo/khớp FLOPs thật giữa 2 arm.
train:
  lr: 0.0003
  batch_size: 8
  max_steps: 200  # debug scale; giữ giống hệt Arm A/C khi so sánh thật
  entropy_pretrain_steps: 50  # train + freeze entropy model trước khi train latent transformer
seed: 42
run_dir: runs/pillar1_1_3_arm_B_debug
