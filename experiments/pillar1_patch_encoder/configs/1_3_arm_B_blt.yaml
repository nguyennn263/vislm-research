# Câu hỏi con 1.3, Arm B — BLT thuần entropy (plans/PLAN.md, Trụ cột 1)
phase: phase-2-small-train
status: chưa chạy
compute: rtx24gb_ssh  # override: compute=kaggle_debug dataset_target_gb=0.05 (see vislm/args.py)
arm: B
tokenizer: vislm.tokenizers.blt_patch_encoder  # byte-level, không cần tokenizer_name
architecture: blt_entropy_patching  # đúng ý tưởng gốc facebookresearch/blt, không mồi âm tiết
# Biến số cố định giữa Arm A/B/C — PHẢI giống hệt 1_3_arm_A_bpe.yaml:
dataset: data/prepared/fineweb2_vi  # HuggingFaceFW/fineweb-2, config vie_Latn, xem setup/download_prepare_data.py
dataset_target_gb: 0.05  # debug scale; override lên GB thật khi chạy full trên RTX 24GB
model:
  # d_model=192 (không phải 256 như Arm A) — đo bằng experiments/pillar1_patch_encoder/
  # measure_compute_match.py: cùng d_model=256/n_layers=6 với Arm A cho FLOPs/byte gấp
  # ~1.9 lần Arm A (Arm B tốn thêm compute cho local encoder/decoder mỗi byte, ngoài
  # latent transformer mỗi patch) — 192 đưa tỷ lệ về ~1.06x, trong ngưỡng ±20%.
  d_model: 192
  n_layers: 6
  n_heads: 6
  max_seq_len: 512  # tính theo BYTE, không phải patch
entropy_model:
  d_model: 128      # model entropy nhỏ hơn nhiều so với latent transformer, theo đúng thiết kế BLT
  n_layers: 4
  n_heads: 4
patching:
  # Đo thật trên data local (100-150 bước pretrain, mẫu 500-2MB): entropy trung bình
  # ~3.07, median ~2.96 — ngưỡng 1.5 ban đầu quá thấp, gây vỡ patch = 1 byte gần như
  # toàn bộ. 3.7 cho avg patch dao động 2.2-6 byte tuỳ mẫu đo/số bước pretrain (RẤT nhạy
  # quanh vùng entropy trung bình) — coi là điểm bắt đầu hợp lý, KHÔNG phải giá trị cuối;
  # cần đo lại bằng experiments/pillar1_patch_encoder/measure_compute_match.py sau khi
  # entropy model đã pretrain đủ `train.entropy_pretrain_steps` ở scale thật.
  entropy_threshold: 3.7
  max_patch_len: 16
# Compute-matching: đo bằng measure_compute_match.py (heuristic 6*params FLOPs/byte, xem
# vislm/backbones/flops.py) — d_model=256 (bằng Arm A) cho Arm B ~1.9x FLOPs/byte Arm A
# vì Arm B tốn thêm compute local encoder/decoder mỗi BYTE, ngoài latent transformer mỗi
# PATCH (Arm A chỉ tốn compute mỗi TOKEN, không có tầng phụ này). d_model=192 đưa tỷ lệ
# về ~1.06x — trong ngưỡng ±20%, dùng làm giá trị hiện tại. Ước lượng, không phải FLOPs
# đo chính xác (profiler) — xem docstring vislm/backbones/flops.py.
train:
  lr: 0.0003
  batch_size: 8
  max_steps: 200  # debug scale; giữ giống hệt Arm A/C khi so sánh thật
  entropy_pretrain_steps: 50  # train + freeze entropy model trước khi train latent transformer
seed: 42
run_dir: runs/pillar1_1_3_arm_B_debug
